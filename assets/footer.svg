<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF41"/>
      <stop offset="50%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#00FF41"/>
    </linearGradient>

    <!-- Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:0"/>
      <stop offset="15%" style="stop-color:#00FF41;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:0.5"/>
      <stop offset="85%" style="stop-color:#00FF41;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:0"/>
    </linearGradient>

    <!-- Scan Line Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.3)"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="120" rx="8" ry="8" fill="url(#bgGrad)"/>

  <!-- Scan Line Overlay -->
  <rect width="840" height="120" rx="8" ry="8" fill="url(#scanlines)"/>

  <!-- Top Decorative Line -->
  <line x1="20" y1="20" x2="820" y2="20" stroke="url(#lineGrad)" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Terminal Prompt Style -->
  <text x="50" y="48" font-family="'Courier New', monospace" font-size="13" fill="#8B949E">
    $ echo "
    <tspan fill="#00FF41" filter="url(#glow)">Keep Learning, Keep Building, Keep Securing</tspan>
    "
  </text>

  <!-- Main Motto Text -->
  <text x="420" y="78" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">
    Keep Learning, Keep Building, Keep Securing
  </text>

  <!-- Blinking Cursor -->
  <rect x="660" y="60" width="2.5" height="22" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom Status Bar -->
  <rect x="20" y="95" width="800" height="2" fill="#161B22" rx="1"/>
  <rect x="20" y="95" width="180" height="2" fill="#00FF41" rx="1" opacity="0.6">
    <animate attributeName="width" values="180;800;180" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Status Bar Indicators -->
  <text x="30" y="112" font-family="monospace" font-size="9" fill="#8B949E" opacity="0.5">NORMAL</text>
  <text x="420" y="112" font-family="monospace" font-size="9" fill="#8B949E" opacity="0.5" text-anchor="middle">EOF</text>
  <text x="810" y="112" font-family="monospace" font-size="9" fill="#8B949E" opacity="0.5" text-anchor="end">UTF-8 [unix]</text>

  <!-- Animated Status Dots -->
  <circle cx="20" cy="48" r="2" fill="#00FF41" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="78" r="2" fill="#00D4FF" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="108" r="2" fill="#00FF41" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>