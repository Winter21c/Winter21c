<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#0a0a0a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41" />
      <stop offset="50%" style="stop-color:#00d4ff" />
      <stop offset="100%" style="stop-color:#bd93f9" />
    </linearGradient>

    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0.3)" />
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0" />
      <stop offset="15%" style="stop-color:#00ff41;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="85%" style="stop-color:#bd93f9;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#bd93f9;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" rx="8" ry="8" fill="url(#bgGrad)" />

  <!-- Scan line overlay -->
  <rect width="900" height="120" rx="8" ry="8" fill="url(#scanlines)" />

  <!-- Top decorative line -->
  <line x1="20" y1="20" x2="880" y2="20" stroke="url(#lineGrad)" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Terminal prompt style prefix -->
  <text x="60" y="55" fill="#00ff41" font-family="monospace" font-size="14" filter="url(#glow)">
    <tspan fill="#8b949e">➜</tspan>
    <tspan fill="#00ff41"> ~ </tspan>
    <tspan fill="#bd93f9">echo</tspan>
    <tspan fill="#8b949e"> "持续学习，持续构建，持续守护"</tspan>
  </text>

  <!-- Main message -->
  <text x="450" y="80" fill="url(#textGrad)" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    持续学习，持续构建，持续守护
  </text>

  <!-- Blinking cursor -->
  <text x="670" y="80" fill="#00ff41" font-family="monospace" font-size="20" font-weight="bold">
    _
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </text>

  <!-- Bottom status bar -->
  <rect x="20" y="98" width="860" height="2" fill="#161b22" rx="1" />
  <rect x="20" y="98" width="200" height="2" fill="#00ff41" rx="1" opacity="0.6">
    <animate attributeName="width" values="200;860;200" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Status bar text indicators -->
  <text x="30" y="115" fill="#8b949e" font-family="monospace" font-size="9" opacity="0.5">NORMAL</text>
  <text x="450" y="115" fill="#8b949e" font-family="monospace" font-size="9" opacity="0.5" text-anchor="middle">EOF</text>
  <text x="870" y="115" fill="#8b949e" font-family="monospace" font-size="9" opacity="0.5" text-anchor="end">UTF-8 [unix]</text>

  <!-- Decorative gear/dots left side -->
  <circle cx="20" cy="55" r="2" fill="#00ff41" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="80" r="2" fill="#00d4ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="20" cy="105" r="2" fill="#bd93f9" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="1s" repeatCount="indefinite" />
  </circle>
</svg>
